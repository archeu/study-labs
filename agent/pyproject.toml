[project]
name = "agent-labs"
version = "1.0"
description = "AI Agent 学习线的实验代码，每个页面一个目录"
requires-python = ">=3.13"
dependencies = [
    "anthropic>=2.12.0",
    "jieba>=0.42.1",
    "langchain-core>=1.8.5",
    "langgraph>=1.2.24",
    "langgraph-checkpoint-sqlite>=3.1.3",
    "mcp>=2.3.0",
    "numpy>=2.5.5",
    "onnxruntime>=1.32.0",
    "psycopg[binary]>=3.3.9",
    "pydantic>=2.14.4",
    "pymupdf>=2.1",
    "python-docx>=1.2.0",
    "rapidocr>=3.10.0",
]

[dependency-groups]
dev = ["pytest"]

[tool.uv]
package = false
