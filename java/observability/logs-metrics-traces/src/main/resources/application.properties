spring.application.name=order-svc
server.port=18080

# 指标：暴露 /actuator/prometheus；HTTP 耗时打开直方图，Prometheus 才能跨实例合并算 P99
management.endpoints.web.exposure.include=health,prometheus
management.metrics.distribution.percentiles-histogram.http.server.requests=true

# 链路：Spring Boot 默认只采样 10%，实验里改成全采
management.tracing.sampling.probability=1.0

# 日志：控制台输出 JSON（Spring Boot 3.4+ 自带的结构化日志），MDC 里的 traceId、spanId 会成为字段
logging.structured.format.console=logstash

spring.datasource.url=jdbc:h2:mem:orders;DB_CLOSE_DELAY=-1
spring.datasource.hikari.maximum-pool-size=10
spring.sql.init.mode=always
