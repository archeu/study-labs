spring.application.name=order-svc
server.port=18101

spring.datasource.url=jdbc:h2:mem:shop;DB_CLOSE_DELAY=-1
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.connection-timeout=3000
spring.sql.init.mode=always

# 日志里打出 agent 放进 MDC 的 trace_id（agent 的 logback-mdc 插桩用的键是 trace_id、span_id）
logging.pattern.level=%5p [trace_id=%X{trace_id}]
