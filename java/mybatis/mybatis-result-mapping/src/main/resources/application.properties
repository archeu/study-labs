spring.main.banner-mode=off
# H2 的 MySQL 兼容模式，内存库：没有网络往返，所以这里的耗时只看相对大小
spring.datasource.url=jdbc:h2:mem:trade;MODE=MySQL;DB_CLOSE_DELAY=-1
spring.datasource.hikari.maximum-pool-size=4
mybatis.mapper-locations=classpath:mapper/*.xml
mybatis.type-aliases-package=labs.mybatis.mybatis_result_mapping
# 下划线列名自动对上驼峰属性（MyBatis 默认 false，多数项目会打开）
mybatis.configuration.map-underscore-to-camel-case=true
logging.level.root=WARN
