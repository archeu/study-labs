# 默认：Anthropic 模块（官方 Anthropic Java SDK），base-url 指向本机 llama-server 的 /v1/messages
# 连真正的 Claude：去掉 base-url，api-key 换成真的，model 换成 claude-sonnet-5-5
spring.main.web-application-type=none
spring.ai.model.chat=anthropic
spring.ai.anthropic.base-url=http://127.0.0.1:8090
spring.ai.anthropic.api-key=local-no-key
spring.ai.anthropic.max-retries=1
spring.ai.anthropic.chat.model=qwen2.5-0.5b
spring.ai.anthropic.chat.max-tokens=200

# OpenAI 模块也在类路径上：关掉它会自动装配的其他模型类型，避免要 key
spring.ai.openai.api-key=local-no-key
spring.ai.model.embedding=none
spring.ai.model.image=none
spring.ai.model.audio.speech=none
spring.ai.model.audio.transcription=none
spring.ai.model.moderation=none
logging.level.root=WARN
