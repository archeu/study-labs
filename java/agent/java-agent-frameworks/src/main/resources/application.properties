# Spring AI 的 Anthropic 模块，base-url 指向本机 llama-server 的 /v1/messages（Qwen3-1.7B，启动时加 --reasoning-budget 0）
# 连真正的 Claude：去掉 base-url，api-key=${ANTHROPIC_API_KEY}，model 换成 claude-sonnet-5-5
spring.main.web-application-type=none
spring.main.banner-mode=off
spring.ai.anthropic.base-url=http://127.0.0.1:8090
spring.ai.anthropic.api-key=local-no-key
spring.ai.anthropic.max-retries=1
spring.ai.anthropic.chat.model=qwen3-1.7b
spring.ai.anthropic.chat.max-tokens=700
spring.ai.anthropic.chat.temperature=0
logging.level.root=WARN
