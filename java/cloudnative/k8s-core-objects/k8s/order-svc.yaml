# order-svc：4 个副本，先多起一个新的、Ready 了再停一个老的
apiVersion: apps/v1
kind: Deployment
metadata:
  name: order-svc
  labels: { app: order-svc }
spec:
  replicas: 4
  selector:
    matchLabels: { app: order-svc }        # 这个 Deployment 管哪些 Pod：只看标签
  strategy:
    type: RollingUpdate
    rollingUpdate: { maxSurge: 1, maxUnavailable: 0 }
  template:                                  # Pod 模板：改了它，才算一次新版本
    metadata:
      labels: { app: order-svc }
    spec:
      containers:
        - name: app
          image: lab/order-svc-layered:1.8.3
          ports: [{ containerPort: 8080 }]
          env:
            - { name: JAVA_TOOL_OPTIONS, value: "-XX:MaxRAMPercentage=75" }
          resources:
            requests: { cpu: 100m, memory: 384Mi }
            limits: { memory: 384Mi }
          readinessProbe:
            httpGet: { path: /actuator/health/readiness, port: 8080 }
            periodSeconds: 2
---
apiVersion: v1
kind: Service
metadata:
  name: order-svc
spec:
  selector: { app: order-svc }               # 流量发给哪些 Pod：也只看标签
  ports: [{ port: 80, targetPort: 8080 }]
