# 集群里的一个“用户”：每 50 ms 经 Service 调一次，打印成功或失败
apiVersion: v1
kind: Pod
metadata:
  name: client
spec:
  terminationGracePeriodSeconds: 1
  containers:
    - name: c
      image: busybox:1.37.0
      command: ["sh", "-c", "while true; do if wget -q -T 2 -O /dev/null http://order-svc/api/orders/1; then echo \"$(date +%s) ok\"; else echo \"$(date +%s) fail\"; fi; sleep 0.05; done"]
