# 同样启动 40 秒，加上 startupProbe：最多给它 2 分钟，起来之前 liveness 不开始
apiVersion: v1
kind: Pod
metadata: { name: slow-startup, labels: { exp: probe } }
spec:
  containers:
    - name: app
      image: lab/order-svc-chaos:1
      env: [{ name: STARTUP_DELAY_SEC, value: "40" }, { name: JAVA_TOOL_OPTIONS, value: "-XX:MaxRAMPercentage=75" }]
      resources: { requests: { cpu: 100m, memory: 384Mi }, limits: { memory: 384Mi } }
      startupProbe: { httpGet: { path: /actuator/health/liveness, port: 8080 }, periodSeconds: 2, failureThreshold: 60 }
      livenessProbe: { httpGet: { path: /actuator/health/liveness, port: 8080 }, periodSeconds: 5, failureThreshold: 3 }
      readinessProbe: { httpGet: { path: /actuator/health/readiness, port: 8080 }, periodSeconds: 2 }
