# 数据库密码：Secret 挂成文件，也注入成环境变量，对比两种看得见的地方
apiVersion: v1
kind: Secret
metadata: { name: order-db }
type: Opaque
stringData: { password: "s3cr3t-pw" }
---
apiVersion: v1
kind: Pod
metadata: { name: secret-user }
spec:
  terminationGracePeriodSeconds: 1
  containers:
    - name: c
      image: busybox:1.37.0
      env: [{ name: DB_PASSWORD, valueFrom: { secretKeyRef: { name: order-db, key: password } } }]
      command: ["sh", "-c", "sleep 100000"]
      volumeMounts: [{ name: s, mountPath: /etc/secrets, readOnly: true }]
  volumes:
    - { name: s, secret: { secretName: order-db } }
