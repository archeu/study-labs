# 滚动：和上一页一样，4 个副本，先起一个新的、Ready 了再停一个老的；没有 preStop
apiVersion: apps/v1
kind: Deployment
metadata: { name: order }
spec:
  replicas: 4
  selector: { matchLabels: { app: order } }
  strategy: { rollingUpdate: { maxSurge: 1, maxUnavailable: 0 } }
  template:
    metadata: { labels: { app: order } }
    spec:
      containers:
        - name: app
          image: lab/order-svc-layered:1.8.3
          resources: { requests: { cpu: 100m, memory: 384Mi }, limits: { memory: 384Mi } }
          readinessProbe: { httpGet: { path: /actuator/health/readiness, port: 8080 }, periodSeconds: 2 }
---
apiVersion: v1
kind: Service
metadata: { name: order }
spec:
  selector: { app: order }
  ports: [{ port: 80, targetPort: 8080 }]
