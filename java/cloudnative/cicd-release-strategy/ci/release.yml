# 示例：交易靶场 order-svc 的发布流水线（GitHub Actions）。本仓库没有启用它，只作对照阅读。
# 合并到 main → 测试 → 构建并推送镜像 → 改部署仓库里的 tag（Argo CD 从那里同步）
name: release
on:
  push:
    branches: [main]
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "21", cache: maven }   # 依赖缓存：防每次都重新下载
      - run: mvn -B verify                                                   # 编译、单测、Testcontainers 集成测试
  image:
    needs: test                                                              # 测试不过，不打镜像
    runs-on: ubuntu-24.04
    outputs: { tag: "${{ steps.meta.outputs.tag }}" }
    steps:
      - uses: actions/checkout@v4
      - id: meta
        run: echo "tag=$(mvn -q help:evaluate -Dexpression=project.version -DforceStdout)-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@v3
        with: { registry: harbor.lab, username: "${{ secrets.HARBOR_USER }}", password: "${{ secrets.HARBOR_TOKEN }}" }
      - uses: docker/build-push-action@v6
        with:
          push: true
          tags: harbor.lab/trade/order-svc:${{ steps.meta.outputs.tag }}     # 不可变 tag：版本号 + 提交号
          cache-from: type=registry,ref=harbor.lab/trade/order-svc:buildcache
          cache-to: type=registry,ref=harbor.lab/trade/order-svc:buildcache,mode=max
  deploy:
    needs: image
    runs-on: ubuntu-24.04
    environment: production                                                  # 生产环境要人点批准
    steps:
      - uses: actions/checkout@v4
        with: { repository: trade/deploy, token: "${{ secrets.DEPLOY_REPO_TOKEN }}" }
      - run: |
          yq -i '.image.tag = "${{ needs.image.outputs.tag }}"' order-svc/values-prod.yaml
          git commit -am "order-svc ${{ needs.image.outputs.tag }}" && git push   # 集群的凭据不出现在 CI 里
