# 交易靶场的规则：库号和表号用同一个余数（user_id % 8 的奇偶决定库），偶数表在 ds_0、奇数表在 ds_1
dataSources:
  ds_0:
    dataSourceClassName: com.zaxxer.hikari.HikariDataSource
    driverClassName: com.mysql.cj.jdbc.Driver
    jdbcUrl: jdbc:mysql://127.0.0.1:33111/ds_0?useSSL=false&allowPublicKeyRetrieval=true
    username: root
    password: root
  ds_1:
    dataSourceClassName: com.zaxxer.hikari.HikariDataSource
    driverClassName: com.mysql.cj.jdbc.Driver
    jdbcUrl: jdbc:mysql://127.0.0.1:33111/ds_1?useSSL=false&allowPublicKeyRetrieval=true
    username: root
    password: root
rules:
- !SHARDING
  tables:
    t_order:
      actualDataNodes: ds_0.t_order_${[0,2,4,6]},ds_1.t_order_${[1,3,5,7]}
      databaseStrategy:
        standard:
          shardingColumn: user_id
          shardingAlgorithmName: db_by_user
      tableStrategy:
        standard:
          shardingColumn: user_id
          shardingAlgorithmName: table_by_user
  shardingAlgorithms:
    db_by_user:
      type: INLINE
      props:
        algorithm-expression: ds_${user_id % 2}
    table_by_user:
      type: INLINE
      props:
        algorithm-expression: t_order_${user_id % 8}
- !BROADCAST
  tables:
  - t_region
props:
  sql-show: true
