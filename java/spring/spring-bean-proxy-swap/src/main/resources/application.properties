spring.main.banner-mode=off
spring.datasource.url=jdbc:h2:mem:trade;DB_CLOSE_DELAY=-1
logging.level.root=WARN
# 第 4 个场景要看的那条日志：哪些 bean 没被所有 BeanPostProcessor 处理
logging.level.org.springframework.context.support=INFO
# 启动失败时由我们自己打印异常，关掉 Boot 的大段失败报告
logging.level.org.springframework.boot.diagnostics=OFF
logging.level.org.springframework.boot.SpringApplication=OFF
# Spring 6.2 起：预实例化时吞掉 BeanCurrentlyInCreationException 只记一条 INFO，打开它才看得见
logging.level.org.springframework.beans.factory.support.DefaultListableBeanFactory=INFO
